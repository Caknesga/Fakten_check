<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BAware</title>
  <link rel="stylesheet" href="website/theme.css">
  <style>
    body {
      --layout-width: clamp(25px, var(--popup-width, 400px), 800px);
      width: var(--layout-width);
      padding: 18px clamp(8px, calc(var(--layout-width) / 20), 20px) 0;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; padding-bottom: 15px; font-size: 16px; }
    header img { flex: none; }
    header strong { flex: none; }
    #site { margin-left: auto; color: var(--muted); font-size: 13px; text-align: right; overflow-wrap: anywhere; }
    .status {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: clamp(8px, calc(var(--layout-width) / 28), 14px);
      align-items: center;
      padding: clamp(8px, calc(var(--layout-width) / 25), 16px);
      border-radius: 12px;
      background: var(--status-bg);
    }
    .scope { margin: 0; color: var(--muted); font-size: 12px; font-weight: 650; }
    h1 { margin: 3px 0 6px; color: var(--status-ink); font-size: 22px; line-height: 1.15; overflow-wrap: anywhere; }
    #status-description { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
    .traffic-light { display: grid; gap: 5px; padding: 7px; border-radius: 12px; background: #222d3c; }
    .traffic-light i { width: 11px; height: 11px; border-radius: 50%; background: #4a586d; }
    [data-tone="red"] .red { background: var(--red-light); }
    [data-tone="yellow"] .yellow, [aria-busy="true"] .yellow { background: var(--yellow-light); }
    [data-tone="green"] .green { background: var(--green-light); }
    @media (prefers-reduced-motion: no-preference) {
      [aria-busy="true"] .yellow { animation: pulse 1s ease-in-out infinite alternate; }
      @keyframes pulse { to { opacity: .45; } }
    }
    .options { padding: 11px 0; color: var(--muted); }
    .options summary { width: fit-content; cursor: pointer; font-size: 13px; }
    form { display: grid; gap: 8px; margin: 12px 0; }
    .field { width: 100%; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--ink); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .marks { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    .marks input { margin: 0; accent-color: var(--link); }
    footer { border-top: 1px solid var(--border); padding: 13px 0 15px; }
    footer a { font-weight: 650; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" width="20" height="20" alt="">
    <strong>BAware</strong>
    <span id="site" hidden></span>
  </header>

  <main>
    <section class="status" id="status" data-tone="neutral" role="status" aria-atomic="true">
      <div class="traffic-light" aria-hidden="true"><i class="red"></i><i class="yellow"></i><i class="green"></i></div>
      <div>
        <p class="scope" id="status-scope">Demo review</p>
        <h1 id="status-title">Loading page status</h1>
        <p id="status-description">Getting ready to check the current page.</p>
      </div>
    </section>

    <details class="options">
      <summary>Check options</summary>
      <form id="form">
        <label for="url">Page link</label>
        <input class="field" type="url" id="url" placeholder="https://example.com/article" autocomplete="off" required>
        <div class="actions">
          <button id="go" type="submit" disabled>Check link</button>
          <button id="stop" type="button" hidden>Stop check</button>
        </div>
      </form>
      <label class="marks"><input id="marks" type="checkbox" checked> Highlight claims on the page</label>
    </details>
  </main>

  <footer>
    <a id="report-link" href="website/index.html" target="_blank" rel="noopener noreferrer">View details on the BAware website</a>
  </footer>

  <script src="demo-cases.js"></script>
  <script src="website/review.js"></script>
  <script src="page-reader.js"></script>
  <script src="popup.js"></script>
</body>
</html>
